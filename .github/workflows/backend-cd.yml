name: Backend CD

on:
    workflow_run:
        workflows:
            - Backend CI
        types:
            - completed
        branches:
            - main

jobs:
    deploy:
        name: Deploy to VPS
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to VPS
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s' "$VPS_SSH_KEY" | base64 --decode > ~/.ssh/pathwise_deploy_key
                  chmod 600 ~/.ssh/pathwise_deploy_key

                  ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

                  ssh -i ~/.ssh/pathwise_deploy_key \
                      -o StrictHostKeyChecking=yes \
                      "$VPS_USER@$VPS_HOST" \
                      'cd /var/www/pathwise-backend && git pull --ff-only && bash ./deploy.sh'