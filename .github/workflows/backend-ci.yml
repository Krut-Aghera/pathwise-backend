name: Backend CI

on:
    push:
        branches:
            - main

jobs:
    test:
        name: Run backend tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create test environment
              shell: bash
              run: |
                  cat > .env.test <<EOF
                  NODE_ENV=test

                  APP_NAME=Pathwise-Test
                  PORT=5001
                  CLIENT_URL=http://localhost:5173

                  MONGO_URI=${{ secrets.TEST_MONGO_URI }}
                  DB_NAME=pathwise_testonly

                  JWT_ACCESS_SECRET=test-access-secret
                  ACCESS_TOKEN_EXPIRY=15m
                  ACCESS_TOKEN_COOKIE_EXPIRY=900000

                  JWT_REFRESH_SECRET=test-refresh-secret
                  REFRESH_TOKEN_EXPIRY=7d
                  REFRESH_TOKEN_COOKIE_EXPIRY=604800000

                  EMAIL_LOGO_URL=http://localhost:5173/logo.png

                  MAILTRAP_API_TOKEN=test
                  MAILTRAP_SANDBOX_ID=test
                  MAILTRAP_SENDER_EMAIL=test@example.com
                  MAILTRAP_SENDER_NAME=Pathwise Test

                  CLOUDINARY_CLOUD_NAME=test
                  CLOUDINARY_API_KEY=test
                  CLOUDINARY_API_SECRET=test

                  RAZORPAY_API_KEY=test
                  RAZORPAY_API_SECRET=test
                  RAZORPAY_WEBHOOK_SECRET=test
                  EOF

            - name: Run tests
              run: npm run test:run
